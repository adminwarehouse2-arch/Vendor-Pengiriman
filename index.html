<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Master Ekspedisi & Wilayah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg p-5">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-truck-fast"></i> Dashboard Ekspedisi & Master Wilayah
      </h1>
      <span class="text-sm bg-indigo-700 px-3 py-1 rounded-full border border-indigo-500">Live Sheets Sync</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6">
    <!-- Stat Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-6">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="text-slate-500 text-sm font-medium">Total Ekspedisi</div>
        <div id="stat-ekspedisi" class="text-3xl font-bold text-indigo-600 mt-1">0</div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="text-slate-500 text-sm font-medium">Total Wilayah Coverage</div>
        <div id="stat-wilayah" class="text-3xl font-bold text-emerald-600 mt-1">0</div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="text-slate-500 text-sm font-medium">Layanan Frozen</div>
        <div id="stat-frozen" class="text-3xl font-bold text-cyan-600 mt-1">0</div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="text-slate-500 text-sm font-medium">Layanan Non-Frozen</div>
        <div id="stat-nonfrozen" class="text-3xl font-bold text-amber-600 mt-1">0</div>
      </div>
    </div>

    <!-- Filter & Pencarian -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-center justify-between">
      <div class="relative flex-1 min-w-[250px]">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
        <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Cari Ekspedisi, Daerah, Kategori..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>

    <!-- Tabel Data Master -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead class="bg-slate-100 text-slate-600 text-xs font-semibold uppercase border-b">
            <tr>
              <th class="p-4">Ekspedisi</th>
              <th class="p-4">Daerah</th>
              <th class="p-4">Harga</th>
              <th class="p-4">Satuan</th>
              <th class="p-4">Estimasi Hari</th>
              <th class="p-4">Kategori</th>
              <th class="p-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100 text-sm">
            <tr><td colspan="7" class="p-8 text-center text-slate-400">Memuat data dari Google Sheets...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Edit Data -->
  <div id="edit-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl">
      <h3 class="text-lg font-bold text-slate-800 mb-4">Edit Data Ekspedisi</h3>
      <form id="edit-form" onsubmit="saveEdit(event)" class="space-y-3">
        <input type="hidden" id="edit-row-index">
        <div>
          <label class="text-xs font-semibold text-slate-600">Ekspedisi</label>
          <input type="text" id="edit-ekspedisi" class="w-full p-2 border rounded mt-1 text-sm" required>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Daerah</label>
          <input type="text" id="edit-daerah" class="w-full p-2 border rounded mt-1 text-sm" required>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Harga</label>
          <input type="text" id="edit-harga" class="w-full p-2 border rounded mt-1 text-sm" required>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Satuan</label>
          <input type="text" id="edit-satuan" class="w-full p-2 border rounded mt-1 text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Estimasi Hari</label>
          <input type="text" id="edit-estimasi" class="w-full p-2 border rounded mt-1 text-sm">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Kategori</label>
          <input type="text" id="edit-kategori" class="w-full p-2 border rounded mt-1 text-sm">
        </div>
        <div class="flex justify-end gap-2 mt-5">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm bg-slate-200 rounded-lg hover:bg-slate-300">Batal</button>
          <button type="submit" id="save-btn" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // URL Web App dari Apps Script kamu
    const API_URL = "https://script.google.com/macros/s/AKfycbxpd8825TPLzRBuqhwisJXB0LxiU3-FTyyuPvW-mOjqpYyORc8dJadC_VKupjiegxwCAw/exec";
    let rawData = [];

    document.addEventListener('DOMContentLoaded', loadData);

    function loadData() {
      fetch(API_URL + "?action=getData")
        .then(res => res.json())
        .then(response => {
          rawData = response.rows;
          renderTable(rawData);
          calculateStats(rawData);
        })
        .catch(err => console.error("Error fetching data:", err));
    }

    function renderTable(rows) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      rows.forEach((row, index) => {
        const isFrozen = (row[6] || '').toLowerCase().includes('frozen') && !(row[6] || '').toLowerCase().includes('non');
        const badgeColor = isFrozen ? 'bg-cyan-100 text-cyan-700' : 'bg-amber-100 text-amber-700';

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-4 font-semibold text-slate-800">${row[0] || '-'}</td>
            <td class="p-4">${row[1] || '-'}</td>
            <td class="p-4 font-medium text-emerald-600">${row[2] || '-'}</td>
            <td class="p-4 text-slate-500">${row[3] || '-'}</td>
            <td class="p-4 text-slate-500">${row[4] || '-'}</td>
            <td class="p-4"><span class="px-2 py-1 text-xs rounded-full font-medium ${badgeColor}">${row[6] || 'NON-FROZEN'}</span></td>
            <td class="p-4 text-center">
              <button onclick="openModal(${index})" class="text-indigo-600 hover:text-indigo-800 p-2"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
            </td>
          </tr>
        `;
      });
    }

    function calculateStats(rows) {
      const ekspedisiSet = new Set(rows.map(r => r[0]));
      const daerahSet = new Set(rows.map(r => r[1]));
      let frozenCount = 0;
      let nonFrozenCount = 0;

      rows.forEach(r => {
        const cat = (r[6] || '').toUpperCase();
        if (cat.includes('FROZEN') && !cat.includes('NON')) frozenCount++;
        else nonFrozenCount++;
      });

      document.getElementById('stat-ekspedisi').innerText = ekspedisiSet.size;
      document.getElementById('stat-wilayah').innerText = daerahSet.size;
      document.getElementById('stat-frozen').innerText = frozenCount;
      document.getElementById('stat-nonfrozen').innerText = nonFrozenCount;
    }

    function filterTable() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = rawData.filter(row => row.some(cell => String(cell).toLowerCase().includes(query)));
      renderTable(filtered);
    }

    function openModal(index) {
      const row = rawData[index];
      document.getElementById('edit-row-index').value = index;
      document.getElementById('edit-ekspedisi').value = row[0] || '';
      document.getElementById('edit-daerah').value = row[1] || '';
      document.getElementById('edit-harga').value = row[2] || '';
      document.getElementById('edit-satuan').value = row[3] || '';
      document.getElementById('edit-estimasi').value = row[4] || '';
      document.getElementById('edit-kategori').value = row[6] || '';
      document.getElementById('edit-modal').classList.remove('hidden');
      document.getElementById('edit-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('edit-modal').classList.add('hidden');
      document.getElementById('edit-modal').classList.remove('flex');
    }

    function saveEdit(e) {
      e.preventDefault();
      const btn = document.getElementById('save-btn');
      btn.innerText = "Menyimpan...";
      btn.disabled = true;

      const index = parseInt(document.getElementById('edit-row-index').value);
      const updatedRow = [
        document.getElementById('edit-ekspedisi').value,
        document.getElementById('edit-daerah').value,
        document.getElementById('edit-harga').value,
        document.getElementById('edit-satuan').value,
        document.getElementById('edit-estimasi').value,
        rawData[index][5] || '',
        document.getElementById('edit-kategori').value
      ];

      fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rowIndex: index, rowData: updatedRow })
      }).then(() => {
        rawData[index] = updatedRow;
        renderTable(rawData);
        calculateStats(rawData);
        btn.innerText = "Simpan Perubahan";
        btn.disabled = false;
        closeModal();
      }).catch(err => {
        alert("Gagal menyimpan data.");
        btn.innerText = "Simpan Perubahan";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
